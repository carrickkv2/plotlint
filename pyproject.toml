[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-list-check"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
farm-list-check = "farm_list_check.cli:app"

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx2>=2.13,<3"]  # httpx2 is needed by FastAPI's TestClient

[tool.setuptools.packages.find]
include = ["farm_list_check*"]

[tool.setuptools.package-data]
farm_list_check = ["static/*.html"]
